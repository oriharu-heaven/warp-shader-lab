<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Warp Shader Lab</title>
<meta name="description" content="ドメインワーピングで流体グラフィックを作り、インスタ用サイズのPNGで保存できるWebGLツール">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>Warp Shader Lab</h1>
    <p>スタイルと色を選ぶ → 候補から選ぶ → 形を整える → 保存</p>
  </header>

  <div class="stage" id="stage">
    <div class="frame">
      <canvas id="c" tabindex="0" aria-label="生成グラフィック。ドラッグで模様を動かし、スクロールで拡大縮小できます"></canvas>
      <div class="bar">
        <div class="seg" role="group" aria-label="画像サイズ">
          <button class="size" id="z-11" data-w="1" data-h="1" aria-pressed="true" title="フィード（正方形）">1:1</button>
          <button class="size" id="z-45" data-w="4" data-h="5" aria-pressed="false" title="フィード（縦長）">4:5</button>
          <button class="size" id="z-916" data-w="9" data-h="16" aria-pressed="false" title="ストーリーズ">9:16</button>
        </div>
        <div class="tools">
          <button id="undo" disabled title="1つ前に戻す（Ctrl/⌘+Z）">↶ 戻す</button>
          <button id="pause" aria-pressed="false">一時停止</button>
          <button class="primary" id="save">PNGで保存</button>
        </div>
      </div>
      <p class="hint">画像をドラッグで移動、スクロールで拡大・縮小、ダブルクリックで位置を戻す。保存は幅1080px。</p>
      <p class="toast" id="toast" role="status"></p>
    </div>
  </div>

  <aside class="panel">
    <section class="sec">
      <h2>スタイル</h2>
      <div class="tabs">
        <button class="preset" id="p-holo" data-p="holo" aria-pressed="true">Holo<small>虹色＋網点</small></button>
        <button class="preset" id="p-mono" data-p="mono" aria-pressed="false">Mono<small>2色＋粒子</small></button>
      </div>
    </section>

    <section class="sec" id="color-holo">
      <h2>色</h2>
      <div class="knob">
        <label class="name" for="holoHue">虹色の位置</label>
        <input type="range" class="track" id="holoHue" min="0" max="1" step="0.005">
      </div>
    </section>

    <section class="sec" id="color-mono" hidden>
      <h2>色</h2>
      <div class="swatches" id="swatches" role="group" aria-label="色の組み合わせ"></div>
      <div class="knob">
        <label class="name" for="monoHue">色相</label>
        <input type="range" class="track" id="monoHue" min="0" max="360" step="1">
      </div>
      <div class="knob">
        <label class="name" for="monoSat">鮮やかさ</label>
        <input type="range" class="track" id="monoSat" min="0" max="1" step="0.01">
        <div class="ends"><span>白黒</span><span>色が強い</span></div>
      </div>
      <div class="pickers">
        <label>色1 <input type="color" id="ink"></label>
        <label>色2 <input type="color" id="paper"></label>
        <button class="small" id="swap">色を入れ替え</button>
      </div>
    </section>

    <section class="sec">
      <h2>候補から選ぶ <button class="small" id="more">別の候補</button></h2>
      <div class="cands" id="cands"></div>
    </section>

    <section class="sec">
      <h2>形</h2>
      <div class="sec" id="k-shape"></div>
    </section>

    <section class="sec">
      <h2>質感</h2>
      <div class="sec" id="k-tex"></div>
    </section>

    <details>
      <summary>詳細設定（数値で調整）</summary>
      <div class="sec"><h2>形</h2><div id="raw-shape"></div></div>
      <div class="sec"><h2>質感</h2><div id="raw-tex"></div></div>
      <div class="sec">
        <button id="reset">このスタイルの最初の状態に戻す</button>
        <button id="copy">シェーダー（GLSL）をコピー</button>
        <p class="note">Shadertoy や p5.js の createShader に移植できます。uniform名だけ合わせてください。</p>
      </div>
    </details>
  </aside>
</div>

<div class="overlay" id="ov" hidden>
  <img id="ovimg" alt="書き出した画像">
  <p>画像を長押し（スマホ）または右クリック（PC）で保存できます</p>
  <button id="ovclose">閉じる</button>
</div>

<script src="js/shader.js"></script>
<script src="js/main.js"></script>
</body>
</html>
